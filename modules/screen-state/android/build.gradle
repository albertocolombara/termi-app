plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screenstate'
version = '0.1.0'

android {
  namespace "expo.modules.screenstate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // Mesma versão do expo-audio: o ExoPlayer já está no APK, não pesa a mais.
  implementation "androidx.media3:media3-exoplayer:1.9.1"
}
